description: LSSTCam specialization of the DRP pipeline
instrument: lsst.obs.lsst.LsstCam
parameters:
  add_point_source: false
  fix_centroid: false
  prior_axrat_stddev: null
  sersic_init_table: object_exp_multiprofit
  use_cell_coadds: true
  use_shapelet_psf: false
  base_uri: ''
  hips_title: ''
  abs_max: 75500
  rgb_lum_floor: 6.0e-05
  release_id: 0
  image_type: legacy
  schemaFile: lsstcam.yaml
  exclude_aggregate_mask_planes:
  - NOT_DEBLENDED
tasks:
  aggregateCalibrateImageMetadata:
    class: lsst.analysis.tools.tasks.AggregatedTaskMetadataAnalysisTask
    config:
    - file:
      - $ANALYSIS_TOOLS_DIR/config/aggregateCalibrateImageMetadata.py
      connections.inputName: calibrateImage_metadata
      connections.outputName: calibrateImage_metadata_aggregate
      inputDataDimensions:
      - instrument
      - visit
      - detector
      outputDimensions:
      - instrument
      - visit
  makeMetricTableAggregateCalibrateImageMetadata:
    class: lsst.analysis.tools.tasks.MakeMetricTableTask
    config:
    - connections.metricBundleName: calibrateImage_metadata_aggregate_metrics
      connections.outputTableName: calibrateImage_metadata_aggregate_metrics_table
      inputDataDimensions:
      - instrument
      - visit
      outputTableDimensions:
      - instrument
      dataIdFieldsToIncludeAsColumns:
      - visit
      - band
  analyzeSingleVisitStar:
    class: lsst.analysis.tools.tasks.SourceTableVisitAnalysisTask
    config:
    - file:
      - $ANALYSIS_TOOLS_DIR/config/sourceTableCore.py
      connections.data: single_visit_star
      connections.outputName: single_visit_star
    - doProducePlots: false
  makeAnalysisSingleVisitStarAstrometricRefMatch:
    class: lsst.analysis.tools.tasks.astrometricCatalogMatch.AstrometricCatalogMatchVisitTask
    config:
    - connections.targetCatalog: single_visit_star
      connections.visitSummaryTable: preliminary_visit_summary
      connections.matchedCatalog: '{targetCatalog}_ref_match_astrom'
  analyzeSingleVisitStarAstrometricRefMatch:
    class: lsst.analysis.tools.tasks.refCatSourceAnalysis.RefCatSourceAnalysisTask
    config:
    - file:
      - $ANALYSIS_TOOLS_DIR/config/refCatSourceAstrometricCore.py
      connections.targetCatalog: single_visit_star
      connections.data: '{targetCatalog}_ref_match_astrom'
      connections.outputName: single_visit_star_ref_match_astrom
    - doProducePlots: false
  makeSingleVisitStarAstrometricRefMatchMetricTable:
    class: lsst.analysis.tools.tasks.MakeMetricTableTask
    config:
    - connections.metricBundleName: single_visit_star_ref_match_astrom_metrics
      connections.outputTableName: single_visit_star_ref_match_astrom_metrics_table
      inputDataDimensions:
      - visit
      outputTableDimensions:
      - instrument
      dataIdFieldsToIncludeAsColumns:
      - visit
      - band
  makeAnalysisSingleVisitStarPhotometricRefMatch:
    class: lsst.analysis.tools.tasks.photometricCatalogMatch.PhotometricCatalogMatchVisitTask
    config:
    - connections.targetCatalog: single_visit_star
      connections.visitSummaryTable: preliminary_visit_summary
      connections.matchedCatalog: '{targetCatalog}_ref_match_photom'
  analyzeSingleVisitStarPhotometricRefMatch:
    class: lsst.analysis.tools.tasks.refCatSourcePhotometricAnalysis.RefCatSourcePhotometricAnalysisTask
    config:
    - file:
      - $ANALYSIS_TOOLS_DIR/config/refCatSourcePhotometricCore.py
      connections.targetCatalog: single_visit_star
      connections.data: '{targetCatalog}_ref_match_photom'
      connections.outputName: single_visit_star_ref_match_photom
    - doProducePlots: false
  analyzeSingleVisitStarAssociation:
    class: lsst.analysis.tools.tasks.AssociatedSourcesTractAnalysisTask
    config:
    - file:
      - $ANALYSIS_TOOLS_DIR/config/matchedVisitCore.py
      connections.sourceCatalogs: single_visit_star
      connections.associatedSources: isolated_star
      connections.associatedSourceIds: isolated_star_association
      connections.outputName: single_visit_star_association
      applyAstrometricCorrections: false
      maxObjects: 100000
  makeAnalysisSingleVisitStarAssociationMetricTable:
    class: lsst.analysis.tools.tasks.MakeMetricTableTask
    config:
    - connections.metricBundleName: single_visit_star_association_metrics
      connections.metricTable: single_visit_star_association_metrics_table
      inputDataDimensions:
      - instrument
      - skymap
      - tract
  makeAnalysisSingleVisitStarAssociationWholeSkyPlot:
    class: lsst.analysis.tools.tasks.WholeSkyAnalysisTask
    config:
    - file:
      - $ANALYSIS_TOOLS_DIR/config/matchedVisitCoreWholeSkyPlot.py
      connections.inputName: single_visit_star_association_metrics_table
      connections.outputName: single_visit_star_association_whole_sky
  makeAnalysisRecalibratedStarAstrometricRefMatch:
    class: lsst.analysis.tools.tasks.astrometricCatalogMatch.AstrometricCatalogMatchVisitTask
    config:
    - connections.targetCatalog: recalibrated_star
      connections.visitSummaryTable: visit_summary
      connections.matchedCatalog: '{targetCatalog}_ref_match_astrom'
  analyzeRecalibratedStarAstrometricRefMatch:
    class: lsst.analysis.tools.tasks.refCatSourceAnalysis.RefCatSourceAnalysisTask
    config:
    - file:
      - $ANALYSIS_TOOLS_DIR/config/refCatSourceAstrometricCore.py
      connections.targetCatalog: recalibrated_star
      connections.data: '{targetCatalog}_ref_match_astrom'
      connections.outputName: recalibrated_star_ref_match_astrom
    - python: |
        from lsst.analysis.tools.atools import *
        from lsst.analysis.tools.contexts import VisitContext
      atools: None
      atools.astromDiffMetrics: TargetRefCatDeltaMetrics
      atools.astromDiffMetrics.applyContext: VisitContext
  makeRecalibratedStarAstrometricRefMatchMetricTable:
    class: lsst.analysis.tools.tasks.MakeMetricTableTask
    config:
    - connections.metricBundleName: recalibrated_star_ref_match_astrom_metrics
      connections.outputTableName: recalibrated_star_ref_match_astrom_metrics_table
      inputDataDimensions:
      - visit
      outputTableDimensions:
      - instrument
      dataIdFieldsToIncludeAsColumns:
      - visit
      - band
  analyzeRecalibratedStarObjectMatch:
    class: lsst.analysis.tools.tasks.SourceObjectTableAnalysisTask
    config:
    - connections.data: recalibrated_star
      connections.associatedSources: isolated_star
      connections.associatedSourceIds: isolated_star_association
      connections.refCat: object_patch
      connections.visitTable: visit_table
  analyzeRecalibratedStarAssociation:
    class: lsst.analysis.tools.tasks.AssociatedSourcesTractAnalysisTask
    config:
    - file:
      - $ANALYSIS_TOOLS_DIR/config/matchedVisitCore.py
      connections.sourceCatalogs: recalibrated_star
      connections.associatedSources: isolated_star
      connections.associatedSourceIds: isolated_star_association
      connections.outputName: recalibrated_star_association
      connections.visitTable: preliminary_visit_table
      applyAstrometricCorrections: true
      maxObjects: 100000
  makeAnalysisRecalibratedStarAssociationMetricTable:
    class: lsst.analysis.tools.tasks.MakeMetricTableTask
    config:
    - connections.metricBundleName: recalibrated_star_association_metrics
      connections.metricTable: recalibrated_star_association_metrics_table
      inputDataDimensions:
      - instrument
      - skymap
      - tract
  makeAnalysisRecalibratedStarAssociationWholeSkyPlot:
    class: lsst.analysis.tools.tasks.WholeSkyAnalysisTask
    config:
    - file:
      - $ANALYSIS_TOOLS_DIR/config/matchedVisitCoreWholeSkyPlot.py
      connections.inputName: recalibrated_star_association_metrics_table
      connections.outputName: recalibrated_star_association_whole_sky
  analyzeObjectTableCore:
    class: lsst.analysis.tools.tasks.ObjectTableTractAnalysisTask
    config:
    - python: |
        from lsst.analysis.tools.atools import *
        from lsst.analysis.tools.contexts import *
      connections.outputName: objectTableCore
      atools.shapeSizeFractionalDiff: ShapeSizeFractionalDiffScatter
      atools.e1Diff: E1DiffScatter
      atools.e2Diff: E2DiffScatter
      atools.skyFluxStatisticMetric: SkyFluxStatisticMetric
      atools.skyFluxStatisticMetric.applyContext: CoaddContext
      atools.wPerpPSF: WPerpPSF
      atools.wPerpCModel: WPerpCModel
      atools.xPerpPSF: XPerpPSF
      atools.xPerpCModel: XPerpCModel
      atools.yPerpPSF: YPerpPSF
      atools.yPerpCModel: YPerpCModel
      atools.skyObjectSky: SkyObjectSkyPlot
      atools.skyObjectFlux: SkyObjectHistPlot
      atools.psfCModelScatter: PsfCModelScatterPlot
      atools.psfSersicScatter: PsfSersicScatterPlot
      atools.shapeSizeDetRadiusVsCmodelMag: SizeMagnitudePlot
      atools.shapeSizeDetRadiusVsCmodelMag.size_type: determinantRadius
      atools.shapeSizeDetRadiusVsCmodelMag.mag_x: cmodel_err
      atools.shapeSizeDetRadiusVsCmodelMag.size_y: shape_slot
      atools.shapeSizeDetRadiusVsCmodelMag.produce.plot.xLims: (17, 29)
      atools.shapeSizeDetRadiusVsCmodelMag.produce.plot.yLims: (-3, 2)
      atools.shapeSizeDetRadiusVsCmodelMag.applyContext: CoaddContext
      atools.shapeSizeDetRadiusVsPsfMag: SizeMagnitudePlot
      atools.shapeSizeDetRadiusVsPsfMag.size_type: determinantRadius
      atools.shapeSizeDetRadiusVsPsfMag.mag_x: psf_err
      atools.shapeSizeDetRadiusVsPsfMag.size_y: shape_slot
      atools.shapeSizeDetRadiusVsPsfMag.applyContext: CoaddContext
      atools.cModelBulgeSizeVsCmodelBulgeMag: SizeMagnitudePlot
      atools.cModelBulgeSizeVsCmodelBulgeMag.size_type: singleColumnSize
      atools.cModelBulgeSizeVsCmodelBulgeMag.mag_x: bulge_err
      atools.cModelBulgeSizeVsCmodelBulgeMag.size_y: bulge
      atools.cModelBulgeSizeVsCmodelBulgeMag.produce.plot.xLims: (17, 29)
      atools.cModelBulgeSizeVsCmodelBulgeMag.produce.plot.yLims: (-3, 2)
      atools.cModelBulgeSizeVsCmodelBulgeMag.applyContext: CoaddContext
      atools.cModelDiskSizeVsCmodelDiskMag: SizeMagnitudePlot
      atools.cModelDiskSizeVsCmodelDiskMag.size_type: singleColumnSize
      atools.cModelDiskSizeVsCmodelDiskMag.mag_x: disk_err
      atools.cModelDiskSizeVsCmodelDiskMag.size_y: disk
      atools.cModelDiskSizeVsCmodelDiskMag.produce.plot.xLims: (17, 29)
      atools.cModelDiskSizeVsCmodelDiskMag.produce.plot.yLims: (-3, 2)
      atools.cModelDiskSizeVsCmodelDiskMag.applyContext: CoaddContext
      atools.exponentialSizeVsExponentialMag: SizeMagnitudePlot
      atools.exponentialSizeVsExponentialMag.is_covariance: false
      atools.exponentialSizeVsExponentialMag.mag_x: exponential_err
      atools.exponentialSizeVsExponentialMag.size_type: singleColumnSize
      atools.exponentialSizeVsExponentialMag.size_y: exponential
      atools.exponentialSizeVsExponentialMag.produce.plot.xLims: (17, 29)
      atools.exponentialSizeVsExponentialMag.produce.plot.yLims: (-3, 2)
      atools.exponentialSizeVsExponentialMag.applyContext: CoaddContext
      atools.exponentialSizeVsSersicMag: SizeMagnitudePlot
      atools.exponentialSizeVsSersicMag.is_covariance: false
      atools.exponentialSizeVsSersicMag.mag_x: sersic_err
      atools.exponentialSizeVsSersicMag.size_type: singleColumnSize
      atools.exponentialSizeVsSersicMag.size_y: exponential
      atools.exponentialSizeVsSersicMag.produce.plot.xLims: (17, 29)
      atools.exponentialSizeVsSersicMag.produce.plot.yLims: (-3, 2)
      atools.exponentialSizeVsSersicMag.applyContext: CoaddContext
      atools.exponentialEllipticityVsExponentialMag: ExponentialEllipticityMagnitudePlot
      atools.exponentialEllipticityVsExponentialMag.mag_x: exponential_err
      atools.exponentialEllipticityVsExponentialMag.produce.plot.xLims: (17, 29)
      atools.exponentialEllipticityVsExponentialMag.selector_galaxy.vectorKey: griz_model_extendedness
      atools.exponentialEllipticityVsExponentialMag.selector_galaxy.extendedness_minimum: 0.3
      atools.exponentialEllipticityVsExponentialMag.selector_star.vectorKey: griz_model_extendedness
      atools.exponentialEllipticityVsExponentialMag.selector_star.extendedness_maximum: 0.3
      atools.exponentialEllipticityVsExponentialMag.applyContext: CoaddContext
      atools.sersicSizeVsSersicMag: SizeMagnitudePlot
      atools.sersicSizeVsSersicMag.is_covariance: false
      atools.sersicSizeVsSersicMag.mag_x: sersic_err
      atools.sersicSizeVsSersicMag.size_type: singleColumnSize
      atools.sersicSizeVsSersicMag.size_y: sersic
      atools.sersicSizeVsSersicMag.produce.plot.xLims: (17, 29)
      atools.sersicSizeVsSersicMag.produce.plot.yLims: (-3, 2)
      atools.sersicSizeVsSersicMag.applyContext: CoaddContext
      atools.sersicEllipticityVsSersicMag: SersicEllipticityMagnitudePlot
      atools.sersicEllipticityVsSersicMag.mag_x: sersic_err
      atools.sersicEllipticityVsSersicMag.produce.plot.xLims: (17, 29)
      atools.sersicEllipticityVsSersicMag.selector_galaxy.vectorKey: griz_model_extendedness
      atools.sersicEllipticityVsSersicMag.selector_galaxy.extendedness_minimum: 0.3
      atools.sersicEllipticityVsSersicMag.selector_star.vectorKey: griz_model_extendedness
      atools.sersicEllipticityVsSersicMag.selector_star.extendedness_maximum: 0.3
      atools.sersicEllipticityVsSersicMag.applyContext: CoaddContext
      atools.sersicIndexVsSersicMag: SingleColumnMagnitudeScatterPlot
      atools.sersicIndexVsSersicMag.mag_x: sersic_err
      atools.sersicIndexVsSersicMag.key_y: sersic_index
      atools.sersicIndexVsSersicMag.produce.plot.yAxisLabel: "S\xE9rsic index"
      atools.sersicIndexVsSersicMag.produce.plot.xLims: (17, 29)
      atools.sersicIndexVsSersicMag.produce.plot.yLims: (0.4, 6.1)
      atools.sersicIndexVsSersicMag.produce.plot.legendLocation: upper right
      atools.sersicIndexVsSersicMag.applyContext: CoaddContext
      atools.coaddInputCount: CoaddInputCount
      atools.coaddPatchCount: CountPatches
      atools.fiveSigmaDepth: FiveSigmaPointSourceDepthMetric
      atools.fiveSigmaDepth.applyContext: CoaddContext
    - connections.data: object_all
      connections.inputName: object
      connections.outputName: object
  analyzeObjectParentTableCore:
    class: lsst.analysis.tools.tasks.ObjectTableTractAnalysisTask
    config:
    - python: |
        from lsst.analysis.tools.atools import *
        from lsst.analysis.tools.contexts import *
      connections.data: object_parent
      connections.inputName: object_parent
      connections.outputName: objectParentTableCore
      atools.parentDeblenderMetrics: ParentDeblenderMetrics
      atools.skippedDeblenderMetrics: SkippedDeblenderMetrics
      atools.blendMetrics: BlendMetrics
      atools.isolatedDeblenderMetrics: IsolatedDeblenderMetrics
    - connections.data: object_parent
      connections.inputName: object_parent
      connections.outputName: object_parent
  analyzeObjectTableSurveyCore:
    class: lsst.analysis.tools.tasks.ObjectTableSurveyAnalysisTask
    config:
    - python: |
        from lsst.analysis.tools.atools import *
        from lsst.analysis.tools.contexts import *
        from lsst.analysis.tools.actions.plot import *
      connections.outputName: objectTableSurvey
      atools.rhoStatistics: RhoStatistics
      bands:
      - i
    - connections.data: object_all
      connections.input: deep
      connections.outputName: object_survey
  catalogMatchTract:
    class: lsst.analysis.tools.tasks.astrometricCatalogMatch.AstrometricCatalogMatchTask
    config:
    - connections.catalog: object_all
      connections.targetCatalog: object
      connections.matchedCatalog: '{targetCatalog}_ref_match_astrom'
  refCatObjectTract:
    class: lsst.analysis.tools.tasks.refCatObjectAnalysis.RefCatObjectAnalysisTask
    config:
    - python: |
        from lsst.analysis.tools.atools import *
        from lsst.analysis.tools.contexts import *
      atools.astromDiffRAScatterPlot: TargetRefCatDeltaRAScatterPlot
      atools.astromDiffDecScatterPlot: TargetRefCatDeltaDecScatterPlot
      atools.astromDiffRASkyPlot: TargetRefCatDeltaRASkyPlot
      atools.astromDiffDecSkyPlot: TargetRefCatDeltaDecSkyPlot
      atools.astromDiffMetrics: TargetRefCatDeltaMetrics
      atools.astromDiffMetrics.applyContext: CoaddContext
    - connections.targetCatalog: object
      connections.data: '{targetCatalog}_ref_match_astrom'
      connections.outputName: object_ref_match_astrom
  photometricCatalogMatch:
    class: lsst.analysis.tools.tasks.photometricCatalogMatch.PhotometricCatalogMatchTask
    config:
    - connections.catalog: object_all
      connections.targetCatalog: object
      connections.matchedCatalog: '{targetCatalog}_ref_match_photom'
  photometricRefCatObjectTract:
    class: lsst.analysis.tools.tasks.refCatObjectPhotometricAnalysis.RefCatObjectPhotometricAnalysisTask
    config:
    - python: |
        from lsst.analysis.tools.atools import *
        from lsst.analysis.tools.contexts import *
      atools.targetRefCatDeltaPsfScatterPlot: TargetRefCatDeltaPsfScatterPlot
      atools.targetRefCatDeltaCModelScatterPlot: TargetRefCatDeltaCModelScatterPlot
      atools.targetRefCatDeltaPsfSkyPlot: TargetRefCatDeltaPsfSkyPlot
      atools.targetRefCatDeltaCModelSkyPlot: TargetRefCatDeltaCModelSkyPlot
      atools.photomDiffMetrics: TargetRefCatDeltaPhotomMetrics
      atools.photomDiffMetrics.applyContext: CoaddContext
    - connections.targetCatalog: object
      connections.data: '{targetCatalog}_ref_match_photom'
      connections.outputName: object_ref_match_photom
  plotPropertyMapTract:
    class: lsst.analysis.tools.tasks.PerTractPropertyMapAnalysisTask
    config:
    - python: 'from lsst.analysis.tools.atools import PerTractPropertyMapTool

        '
      connections.outputName: propertyMapTract
      zoomFactors:
      - 2
      - 8
      projectionKwargs:
        celestial: true
        gridlines: true
        min_lon_ticklabel_delta: 0.12
      colorbarKwargs:
        cmap: viridis
      atools.deepCoadd_dcr_ddec_map_weighted_mean: PerTractPropertyMapTool
      atools.deepCoadd_dcr_dra_map_weighted_mean: PerTractPropertyMapTool
      atools.deepCoadd_dcr_e1_map_weighted_mean: PerTractPropertyMapTool
      atools.deepCoadd_dcr_e2_map_weighted_mean: PerTractPropertyMapTool
      atools.deepCoadd_epoch_map_min: PerTractPropertyMapTool
      atools.deepCoadd_epoch_map_max: PerTractPropertyMapTool
      atools.deepCoadd_epoch_map_mean: PerTractPropertyMapTool
      atools.deepCoadd_exposure_time_map_sum: PerTractPropertyMapTool
      atools.deepCoadd_exposure_time_map_sum.nBinsHist: 35
      atools.deepCoadd_psf_e1_map_weighted_mean: PerTractPropertyMapTool
      atools.deepCoadd_psf_e2_map_weighted_mean: PerTractPropertyMapTool
      atools.deepCoadd_psf_maglim_map_weighted_mean: PerTractPropertyMapTool
      atools.deepCoadd_psf_size_map_weighted_mean: PerTractPropertyMapTool
      atools.deepCoadd_sky_background_map_weighted_mean: PerTractPropertyMapTool
      atools.deepCoadd_sky_noise_map_weighted_mean: PerTractPropertyMapTool
  makeBinnedDeepCoaddImage:
    class: lsst.analysis.tools.tasks.MakeBinnedCoaddTask
    config:
    - binFactor: 16
      doBinInnerBBox: true
      connections.coadd: deep_coadd
      connections.binnedCoadd: deep_coadd_bin
  makeWholeTractDeepCoaddImage:
    class: lsst.analysis.tools.tasks.WholeTractImageAnalysisTask
    config:
    - python: 'from lsst.analysis.tools.atools import *

        '
      connections.outputName: deep
      atools.coaddImage: WholeTractImageTool
      atools.clippedMask: WholeTractClippedMaskTool
      atools.coaddImagePostageStamp: WholeTractPostageStampTool
    - connections.data: deep_coadd_bin
      connections.outputName: deep
  aggregateDeepCoaddMaskFractions:
    class: lsst.analysis.tools.tasks.WholeTractMaskFractionAnalysisTask
    config:
    - file:
      - $ANALYSIS_TOOLS_DIR/config/wholeTractMaskFractionMetrics.py
      connections.data: deepCoadd_calexp_bin
      connections.outputName: deepCoadd_tract_mask_fraction
    - file:
      - $ANALYSIS_TOOLS_DIR/config/wholeTractMaskFractionMetrics.py
      connections.data: deep_coadd_bin
      connections.outputName: deep_coadd_tract_mask_fraction
    - file:
      - $DRP_PIPE_DIR/config/aggregateDeepCoaddMaskFractions.py
      - $ANALYSIS_TOOLS_DIR/config/wholeTractMaskFractionMetrics.py
      connections.data: deep_coadd_bin
      connections.outputName: deep_coadd_tract_mask_fraction
  makeBinnedDeepCoaddNImage:
    class: lsst.analysis.tools.tasks.MakeBinnedCoaddTask
    config:
    - connections.coadd: deepCoadd_nImage
      connections.binnedCoadd: deepCoadd_nImage_bin
      coaddStorageClass: ImageU
      binFactor: 16
      doBinInnerBBox: true
    - connections.coadd: deep_coadd_n_image
      connections.binnedCoadd: deep_coadd_n_image_bin
  makeWholeTractDeepCoaddNImage:
    class: lsst.analysis.tools.tasks.WholeTractImageAnalysisTask
    config:
    - python: 'from lsst.analysis.tools.atools import *

        '
      connections.data: deepCoadd_nImage_bin
      connections.outputName: deep
      dataStorageClass: ImageU
      atools.nImage: WholeTractNImageTool
    - connections.data: deep_coadd_n_image_bin
      connections.outputName: deep
  makeBinnedTemplateCoaddImage:
    class: lsst.analysis.tools.tasks.MakeBinnedCoaddTask
    config:
    - connections.coadd: goodSeeingCoadd
      connections.binnedCoadd: goodSeeingCoadd_bin
      binFactor: 16
      doBinInnerBBox: true
    - connections.coadd: template_coadd
      connections.binnedCoadd: template_coadd_bin
      binFactor: 16
      doBinInnerBBox: true
  makeWholeTractTemplateCoaddImage:
    class: lsst.analysis.tools.tasks.WholeTractImageAnalysisTask
    config:
    - python: 'from lsst.analysis.tools.atools import *

        '
      connections.data: goodSeeingCoadd_bin
      connections.outputName: goodSeeing
      atools.coaddImage: WholeTractImageTool
      atools.clippedMask: WholeTractClippedMaskTool
      atools.coaddImagePostageStamp: WholeTractPostageStampTool
    - python: 'from lsst.analysis.tools.atools import *

        '
      connections.data: template_coadd_bin
      connections.outputName: template
      atools.coaddImage: WholeTractImageTool
      atools.clippedMask: WholeTractClippedMaskTool
      atools.coaddImagePostageStamp: WholeTractPostageStampTool
  aggregateTemplateCoaddMaskFractions:
    class: lsst.analysis.tools.tasks.WholeTractMaskFractionAnalysisTask
    config:
    - file:
      - $ANALYSIS_TOOLS_DIR/config/wholeTractMaskFractionMetrics.py
      connections.data: goodSeeingCoadd_bin
      connections.outputName: goodSeeingCoadd_tract_mask_fraction
    - file:
      - $ANALYSIS_TOOLS_DIR/config/wholeTractMaskFractionMetrics.py
      connections.data: template_coadd_bin
      connections.outputName: template_coadd_tract_mask_fraction
  makeBinnedTemplateCoaddNImage:
    class: lsst.analysis.tools.tasks.MakeBinnedCoaddTask
    config:
    - connections.coadd: goodSeeingCoadd_nImage
      connections.binnedCoadd: goodSeeingCoadd_nImage_bin
      coaddStorageClass: ImageU
      binFactor: 16
      doBinInnerBBox: true
    - connections.coadd: template_coadd_n_image
      connections.binnedCoadd: template_coadd_n_image_bin
      coaddStorageClass: ImageU
      binFactor: 16
      doBinInnerBBox: true
  makeWholeTractTemplateCoaddNImage:
    class: lsst.analysis.tools.tasks.WholeTractImageAnalysisTask
    config:
    - python: 'from lsst.analysis.tools.atools import *

        '
      connections.data: goodSeeingCoadd_nImage_bin
      connections.outputName: goodSeeing
      dataStorageClass: ImageU
      atools.nImage: WholeTractNImageTool
    - python: 'from lsst.analysis.tools.atools import *

        '
      connections.data: template_coadd_n_image_bin
      connections.outputName: template
      dataStorageClass: ImageU
      atools.nImage: WholeTractNImageTool
  validateObjectTableCore:
    class: lsst.analysis.tools.tasks.ObjectTableTractAnalysisTask
    config:
    - python: |
        from lsst.analysis.tools.atools import *
        from lsst.analysis.tools.contexts import *
      connections.outputName: objectTableColumnValidate
      atools.validPsfFluxMetric: ValidFracColumnMetric
      atools.validPsfFluxMetric.vectorKey: psfFlux
      atools.validPsfFluxMetric.applyContext: CoaddContext
      atools.validCmodelFluxMetric: ValidFracColumnMetric
