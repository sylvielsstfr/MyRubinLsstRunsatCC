contracts:
- contract: '''calib_psf_candidate'' not in measureObjectUnforced.propagateFlags.source_flags
    if makeDirectWarp.useVisitSummaryPsf else True'
- contract: '''calib_psf_reserved'' not in measureObjectUnforced.propagateFlags.source_flags
    if makeDirectWarp.useVisitSummaryPsf else True'
- contract: '''calib_psf_used'' not in measureObjectUnforced.propagateFlags.source_flags
    if makeDirectWarp.useVisitSummaryPsf else True'
- contract: assembleTemplateCoadd.connections.coaddExposure == buildTemplate.connections.coaddExposures
- contract: associateDiaSource.connections.assocDiaSourceTable == calculateDiaObject.connections.assocDiaSourceTable
- contract: associateDiaSource.connections.diaObjectTable == calculateDiaObject.connections.diaObjectTable
- contract: buildTemplate.connections.template == subtractImages.connections.template
- contract: consolidateHealSparsePropertyMaps.property_maps == makeHealSparsePropertyMaps.property_maps
- contract: detectAndMeasureDiaSource.connections.diaSources == filterDiaSource.connections.diaSourceCat
- contract: detectAndMeasureDiaSource.connections.subtractedMeasuredExposure == forcedPhotObjectDetector.connections.diaExposure
- contract: detectAndMeasureDiaSource.connections.subtractedMeasuredExposure == standardizeDiaSource.connections.diffIm
- contract: detectCoaddPeaks.useCellCoadds == deblendCoaddFootprints.useCellCoadds
- contract: detectCoaddPeaks.useCellCoadds == deconvolve.useCellCoadds
- contract: detectCoaddPeaks.useCellCoadds == fitDeblendedObjectsSersic.use_cell_coadds
- contract: detectCoaddPeaks.useCellCoadds == fitDeepCoaddPsfGaussians.use_cell_coadds
- contract: detectCoaddPeaks.useCellCoadds == measureObjectForced.useCellCoadds
- contract: detectCoaddPeaks.useCellCoadds == measureObjectUnforced.useCellCoadds
- contract: fgcmBuildFromIsolatedStar.doApplyWcsJacobian == False if calibrateImage.do_illumination_correction
    else True
- contract: fgcmBuildFromIsolatedStar.doApplyWcsJacobian == fgcmOutputProducts.doComposeWcsJacobian
- contract: fitDeepCoaddPsfGaussians.use_cell_coadds == fitDeblendedObjectsExp.use_cell_coadds
- contract: fitDeepCoaddPsfGaussians.use_cell_coadds == fitDeblendedObjectsSersic.use_cell_coadds
- contract: isr.doFlat == True if calibrateImage.do_illumination_correction == True
    else True
- contract: makeDirectWarp.border >= makePsfMatchedWarp.psfMatch.kernel.active.sizeCellX
- contract: makeDirectWarp.border >= makePsfMatchedWarp.psfMatch.kernel.active.sizeCellY
- contract: makeDirectWarp.doApplyFlatBackgroundRatio == calibrateImage.do_illumination_correction
- contract: makeDirectWarp.numberOfNoiseRealizations >= assembleCellCoadd.num_noise_realizations
- contract: makeDirectWarp.warper.cacheSize == assembleDeepCoadd.coaddPsf.cacheSize
- contract: reprocessVisitImage.do_apply_flat_background_ratio == calibrateImage.do_illumination_correction
- contract: selectTemplateCoaddVisits.connections.goodVisits == assembleTemplateCoadd.connections.selectedVisits
- contract: standardizeDiaSource.connections.diaSourceTable == associateDiaSource.connections.diaSourceTables
- contract: standardizeDiaSource.connections.diaSourceTable == consolidateVisitDiaSource.connections.inputCatalogs
- contract: subtractImages.connections.difference == detectAndMeasureDiaSource.connections.difference
- contract: subtractImages.connections.matchedTemplate == detectAndMeasureDiaSource.connections.matchedTemplate
subsets:
  analysis-visit-initial:
    subset:
    - analyzeSingleVisitStarPhotometricRefMatch
    - makeMetricTableAggregateCalibrateImageMetadata
    - analyzeSingleVisitStarAstrometricRefMatch
    - analyzeSingleVisitStar
    - aggregateCalibrateImageMetadata
    - makeAnalysisSingleVisitStarAstrometricRefMatch
    - makeAnalysisSingleVisitStarPhotometricRefMatch
    - makeSingleVisitStarAstrometricRefMatchMetricTable
    description: |
      Subset containing all visit-level analysis tasks in this pipeline.
      This subset allows visit-level analysis to be included in steps
      in a base pipeline and then excluded (with labeledSubsetModifyMode=EDIT)
      in downstream pipelines that do not want visit-level analysis.
  analysis-visit-recalibrated:
    subset:
    - analyzeRecalibratedStarAstrometricRefMatch
    - makeAnalysisRecalibratedStarAstrometricRefMatch
    - makeRecalibratedStarAstrometricRefMatchMetricTable
    description: |
      Subset containing all visit-level analysis tasks that run on the
      recalibrated stars.  This subset contains all of the tasks in this
      pipeline, and hence allows it to be included in steps in a base pipeline
      and then excluded (with labeledSubsetModifyMode=EDIT) in downstream
      pipelines that do not want visit-level analysis.
  step1a-single-visit-detectors:
    subset:
    - calibrateImage
    - isr
    - standardizeSingleVisitStar
    description: |
      A step that processes raws to initial processed images and star catalogs.
      These all run per-detector and may be sharded by detector or visit.

      An instrument constraint is generally redundant but recommended.

      A skymap constraint is unnecessary and not recommended.
  step1b-single-visit-visits:
    subset:
    - analyzeSingleVisitStarPhotometricRefMatch
    - analyzeSingleVisitStarAstrometricRefMatch
    - analyzeSingleVisitStar
    - aggregateCalibrateImageMetadata
    - consolidateVisitSummary
    - makeAnalysisSingleVisitStarAstrometricRefMatch
    - consolidateSingleVisitStar
    - makeAnalysisSingleVisitStarPhotometricRefMatch
    description: |
      A step that consolidates per-detector initial star catalogs and metadata
      to full-focal-plane visit-level versions, and runs analysis on initial
      stars.

      A visit constraint may be used for sharding and may be useful in speeding
      up QuantumGraph generation.

      An instrument constraint is generally redundant but recommended.

      A skymap constraint is unnecessary and not recommended.
  step1c-single-visit-tracts:
    subset:
    - analyzeSingleVisitStarAssociation
    - associateIsolatedStar
    description: |
      A step that matches initial star catalogs (running over tracts) and
      runs analysis on those matches.

      Tract constraints may only be used for sharding; tracts with partial
      visit coverage must always be included.

      An instrument constraint is generally redundant but recommended.

      A skymap constraint is always necessary, to avoid running all tasks
      redundantly on all skymaps in the data repository.
  step1d-single-visit-global:
    subset:
    - makeMetricTableAggregateCalibrateImageMetadata
    - makeAnalysisSingleVisitStarAssociationWholeSkyPlot
    - makeInitialVisitDetectorTable
    - makeSingleVisitStarAstrometricRefMatchMetricTable
    - makeAnalysisSingleVisitStarAssociationMetricTable
    - makeInitialVisitTable
    description: |
      A step that consolidates visit[, detector] metadata and analysis into
      full-survey tables and plots.

      This step's outputs are not consumed by downstream production tasks and
      may be dropped or deferred by pipelines that don't need a checkpoint
      before multi-epoch calibration.

      An instrument constraint is generally redundant but recommended.

      A skymap constraint is generally redundant but recommended.
  step2a-recalibrate-global:
    subset:
    - fgcmFitCycle
    - fgcmBuildFromIsolatedStar
    - fgcmOutputProducts
    description: |
      A step that runs survey-wide multi-visit calibration tasks.

      An instrument constraint is generally redundant but recommended.

      A skymap constraint is generally redundant but recommended.
  step2c-recalibrate-healpix:
    subset:
    - gbdesHealpix3AstrometricFit
    description: |
      A step that runs healpix-level multi-visit calibration tasks.

      A pixel constraint may be used for sharding or avoiding partial-coverage
      pixels, and may be helpful in speeding up QuantumGraph generation.

      An instrument constraint is generally redundant but recommended.
  step2d-recalibrate-visits:
    subset:
    - consolidateRefitPsfModelDetector
    - standardizeRecalibratedStar
    - refitPsfModelDetector
    - recalibrateSingleVisitStar
    - consolidateRecalibratedStar
    - analyzeRecalibratedStarAstrometricRefMatch
    - gaussianProcessesTurbulenceFit
    - updateVisitSummary
    - makeAnalysisRecalibratedStarAstrometricRefMatch
    description: |
      A step that runs visit-level multi-detector calibration tasks and then
      recalibrates the initial stars catalog and runs visit-level analysis on
      it.

      A visit constraint may be used for sharding and may be useful in speeding
      up QuantumGraph generation.

      An instrument constraint is generally redundant but recommended.

      A skymap constraint is generally redundant but recommended.
  step2e-recalibrate-tracts:
    subset:
    - analyzeRecalibratedStarAssociation
    - fitStellarMotion
    description: |
      A step that runs tract-level analysis on associations between
      recalibrated stars (using the same associations originally computed on
      the initial stars).

      This step's outputs are not consumed by downstream production tasks and
      may be dropped by pipelines that don't need a checkpoint after
      multi-epoch calibration.

      A tract constraint may be used for sharding or avoiding partial-coverage
      tracts, and may be helpful in speeding up QuantumGraph generation.

      An instrument constraint is generally redundant but recommended.

      A skymap constraint is generally redundant but recommended.
  step2f-recalibrate-global:
    subset:
    - makeVisitTable
    - makeAnalysisRecalibratedStarAssociationWholeSkyPlot
    - makeVisitDetectorTable
    - makeRecalibratedStarAstrometricRefMatchMetricTable
    - makeAnalysisRecalibratedStarAssociationMetricTable
    description: |
      A step that consolidates final visit[, detector] metadata and analysis
      into full-survey tables.

      This step's outputs are not consumed by downstream production tasks and
      may be dropped or deferred by pipelines that don't need a checkpoint
      after multi-epoch calibration.

      An instrument constraint is generally redundant but recommended.

      A skymap constraint is generally redundant but recommended.
  step3a-coadd-tracts:
